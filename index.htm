<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藍循三十周年校慶晚宴</title>
    <!-- 引入 Confetti 彩紙特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-blue: #0033A0;
            --deep-blue: #001f60;
            --gold-light: #FFDF73;
            --gold-main: #D4AF37;
            --gold-dark: #AA8C2C;
            --text-dark: #2c3e50;
            --bg-glass: rgba(255, 255, 255, 0.92);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif; }

        /* 動態星光背景 */
        body {
            background: linear-gradient(135deg, var(--deep-blue) 0%, var(--primary-blue) 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            position: relative;
        }

        /* 生成星星的容器 */
        #particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: rgba(255, 223, 115, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 223, 115, 0.8);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 1; transform: translateY(80vh) scale(1); }
            80% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(0.5); opacity: 0; }
        }

        /* 慶典質感容器 */
        .container {
            width: 92%;
            max-width: 550px;
            height: 85vh;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(255,255,255,0.5);
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        /* 頂部校慶裝飾線 */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, var(--gold-light), var(--gold-dark), var(--gold-light));
            z-index: 20;
        }

        .page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 40px 35px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.95) translateY(30px);
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow-y: auto;
        }
        .page::-webkit-scrollbar { display: none; }

        .page.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        /* --- 首頁設計 --- */
        .hero-banner { text-align: center; margin-bottom: 25px; }
        
        /* 替換為圖片徽章的特效 (支援去背 PNG 發光) */
        .badge-30-img {
            width: 100px; /* 圖片大小，可依需求微調 */
            height: auto;
            margin-bottom: 15px;
            animation: pulseGlowImg 2.5s infinite alternate;
            filter: drop-shadow(0 5px 15px rgba(212, 175, 55, 0.4));
        }

        @keyframes pulseGlowImg {
            0% { transform: scale(1); filter: drop-shadow(0 5px 10px rgba(212, 175, 55, 0.3)); }
            100% { transform: scale(1.06); filter: drop-shadow(0 10px 25px rgba(212, 175, 55, 0.8)); }
        }

        .hero-banner h1 {
            color: var(--primary-blue);
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* 資訊卡片：校慶金邊設計 */
        .info-card {
            background: white;
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(0,51,160,0.06);
            position: relative;
            overflow: hidden;
        }

        .info-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; width: 6px; height: 100%;
            background: linear-gradient(to bottom, var(--gold-light), var(--gold-dark));
        }

        .info-item {
            margin-bottom: 18px;
            font-size: 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px dashed #eee;
            padding-bottom: 10px;
        }
        .info-item:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
        
        .icon {
            width: 30px; height: 30px;
            background: rgba(212, 175, 55, 0.15);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin-right: 15px; font-size: 14px;
        }

        /* --- 按鈕特效 --- */
        .btn {
            background: linear-gradient(135deg, var(--gold-main), var(--gold-dark));
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            text-align: center;
            display: block;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            text-decoration: none;
        }

        /* 流光特效 */
        .btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 3s infinite;
        }

        @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(212, 175, 55, 0.6); }

        .btn-outline {
            background: white;
            color: var(--primary-blue);
            border: 2px solid var(--primary-blue);
            box-shadow: none;
            margin-top: 10px;
        }
        .btn-outline::after { display: none; }
        .btn-outline:hover { background: var(--primary-blue); color: white; }

        /* --- 報名表單懸浮標籤設計 --- */
        .back-btn {
            background: none; border: none; color: #888;
            cursor: pointer; font-size: 15px; margin-bottom: 20px; text-align: left;
            transition: color 0.3s; font-weight: bold;
        }
        .back-btn:hover { color: var(--gold-main); }

        .form-group { position: relative; margin-bottom: 25px; }

        .form-group input {
            width: 100%;
            padding: 20px 15px 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            background: white;
            transition: all 0.3s;
        }

        /* 懸浮標籤特效 */
        .form-group label.floating {
            position: absolute;
            left: 15px; top: 18px;
            color: #888;
            font-size: 16px;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .form-group input:focus, .form-group input:valid {
            border-color: var(--gold-main);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
            outline: none;
        }

        .form-group input:focus + label.floating, 
        .form-group input:valid + label.floating {
            top: 5px; font-size: 12px; color: var(--gold-main); font-weight: bold;
        }

        /* 檔案上傳區塊 */
        .file-upload-wrapper {
            background: rgba(212, 175, 55, 0.05);
            padding: 25px 20px;
            border-radius: 12px;
            border: 2px dashed var(--gold-main);
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .file-upload-wrapper:hover { background: rgba(212, 175, 55, 0.1); transform: scale(1.02); }
        .file-upload-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .upload-icon { font-size: 30px; margin-bottom: 5px; display: block; }
        .upload-text { color: var(--primary-blue); font-size: 14px; font-weight: bold; }

        /* 載入中遮罩 */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            z-index: 100; opacity: 0; visibility: hidden; transition: opacity 0.3s;
        }
        #loading-overlay.show { opacity: 1; visibility: visible; }

        .loader-ring {
            width: 60px; height: 60px;
            border: 5px solid transparent;
            border-top-color: var(--gold-main);
            border-left-color: var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <!-- 背景星光動畫容器 -->
    <div id="particles"></div>

    <div class="container">
        <!-- 載入中遮罩 -->
        <div id="loading-overlay">
            <div class="loader-ring"></div>
            <h3 style="margin-top: 25px; color: var(--primary-blue);">報名處理中...</h3>
            <p style="color: #888; font-size: 14px; margin-top: 5px;">這可能需要幾秒鐘的時間</p>
        </div>

        <!-- 首頁 -->
        <div id="home-page" class="page active">
            <div class="hero-banner">
                <!-- 讀取 30.png 圖片徽章 -->
                <img src="30.png" alt="30周年徽章" class="badge-30-img" onerror="this.style.display='none';">
                
                <h1>藍循三十周年<br>校慶晚宴</h1>
                
                <!-- 全新校慶標語 -->
                <p style="color: var(--primary-blue); margin-top: 10px; font-weight: bold; font-size: 18px; letter-spacing: 1px;">藍循三十傳承愛，信守真理育英才。</p>
                <p style="color: #888; font-size: 14px; margin-top: 8px;">誠邀校友、家長及教職員共襄盛舉</p>
            </div>

            <div class="info-card">
                <div class="info-item">
                    <div class="icon">📅</div>
                    <div><span style="color:#888; font-size:12px; display:block;">日期</span><strong>2026年11月27日 (五)</strong></div>
                </div>
                <div class="info-item">
                    <div class="icon">⏰</div>
                    <div><span style="color:#888; font-size:12px; display:block;">時間</span><strong>下午 7 時正</strong></div>
                </div>
                <div class="info-item">
                    <div class="icon">📍</div>
                    <div><span style="color:#888; font-size:12px; display:block;">地點</span><strong>藍田循道衛理小學 操場</strong></div>
                </div>
                <div class="info-item">
                    <div class="icon">💰</div>
                    <div><span style="color:#888; font-size:12px; display:block;">費用</span><strong>每位 HK$ 200</strong></div>
                </div>
            </div>

            <button class="btn" onclick="switchPage('form-page')" style="margin-top: auto;">立即報名入席</button>
        </div>

        <!-- 報名頁面 -->
        <div id="form-page" class="page">
            <button class="back-btn" onclick="switchPage('home-page')">← 返回首頁</button>
            <h2 style="color: var(--primary-blue); margin-bottom: 25px; text-align: center;">填寫報名資料</h2>

            <form id="registration-form">
                <div class="form-group">
                    <input type="text" id="name" required>
                    <label class="floating">👤 中文 / 英文姓名</label>
                </div>
                <div class="form-group">
                    <input type="tel" id="phone" required>
                    <label class="floating">📱 聯絡電話</label>
                </div>
                <div class="form-group">
                    <input type="email" id="email" required>
                    <label class="floating">✉️ 電郵地址 (接收確認信)</label>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label style="font-weight:bold; color:var(--text-dark); font-size:14px; display:block; margin-bottom:8px;">💳 第一步：進行付款</label>
                    <a href="#" target="_blank" class="btn btn-outline">🔗 按此開啟付款平台</a>
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="font-weight:bold; color:var(--text-dark); font-size:14px; display:block; margin-bottom:8px;">📸 第二步：上載付款證明 *</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="payment-proof" accept="image/*" required onchange="updateFileName(this)">
                        <span class="upload-icon">📁</span>
                        <div class="upload-text" id="file-name-display">點擊或拖曳上載付款截圖<br><span style="font-weight:normal; color:#888; font-size:12px;">(支援 JPG, PNG)</span></div>
                    </div>
                </div>

                <button type="submit" class="btn">確認並提交報名</button>
            </form>
        </div>
    </div>

    <script>
        // 生成背景星光特效
        function createParticles() {
            const container = document.getElementById('particles');
            for(let i = 0; i < 25; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.width = Math.random() * 6 + 2 + 'px';
                star.style.height = star.style.width;
                star.style.animationDuration = Math.random() * 10 + 5 + 's';
                star.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(star);
            }
        }
        createParticles();

        // 頁面切換特效
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // 更新檔案上傳名稱
        function updateFileName(input) {
            const display = document.getElementById('file-name-display');
            if (input.files && input.files.length > 0) {
                display.innerHTML = `<span style="color:var(--gold-dark); font-size:16px;">✓ 已選擇：${input.files[0].name}</span>`;
                document.querySelector('.file-upload-wrapper').style.borderColor = "var(--gold-dark)";
            }
        }

        // 觸發豪華版彩紙特效
        function fireConfetti() {
            var duration = 4000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#0033A0', '#D4AF37', '#FFDF73'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#0033A0', '#D4AF37', '#FFDF73'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // 表單提交處理
        document.getElementById('registration-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('payment-proof');
            if (fileInput.files.length === 0) { alert('請上載付款證明！'); return; }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                const base64Data = event.target.result.split(',')[1]; 
                
                const payload = {
                    name: document.getElementById('name').value,
                    phone: document.getElementById('phone').value,
                    email: document.getElementById('email').value,
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: base64Data
                };

                submitData(payload);
            };
            reader.readAsDataURL(file);
        });

        // 傳送資料至 GAS
        function submitData(payload) {
            document.getElementById('loading-overlay').classList.add('show');

            // 您目前的 GAS Web App URL
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxWKHYb1R55ddQRhu3i6dCzC7rh6n3aGaYEiNNlG9NenH0FbMLaLVHEmh7Qo5AadBZ4/exec';

            fetch(scriptURL, {
                method: 'POST',
                redirect: 'follow', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading-overlay').classList.remove('show');
                if(data.status === 'success') {
                    fireConfetti();
                    setTimeout(() => {
                        alert('🎉 報名成功！我們已發送確認電郵至您的郵箱。期待在校慶晚宴見到您！');
                        document.getElementById('registration-form').reset();
                        document.getElementById('file-name-display').innerHTML = "點擊或拖曳上載付款截圖<br><span style='font-weight:normal; color:#888; font-size:12px;'>(支援 JPG, PNG)</span>";
                        document.querySelector('.file-upload-wrapper').style.borderColor = "var(--gold-main)";
                        switchPage('home-page');
                    }, 600);
                } else {
                    alert('發生錯誤：' + (data.message || '請稍後再試。'));
                }
            })
            .catch(error => {
                document.getElementById('loading-overlay').classList.remove('show');
                alert('系統連線異常。請確定已在 Apps Script 發布了「新版本」。');
            });
        }
    </script>
</body>
</html>
